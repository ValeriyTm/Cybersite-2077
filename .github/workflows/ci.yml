name: Cybersite-2077 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # 4. Устанавливаем клиент Prisma для генерации типов
      - name: Generate Prisma Client
        run: npx prisma generate --schema=./packages/database/prisma/schema.prisma

      # 5. Проверка линтером серверного кода
      - name: Run EsLint Backend
        run: npm run lint -w server
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 6. Проверка линтером клиентского кода
      - name: Run EsLint Frontend
        run: npm run lint:js -w web
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 7. Проверка линтером клиентских стилей
      - name: Run StyleLint Frontend
        run: npm run lint:style -w web
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 8. Проверка типов TypeScript на фронтенде
      - name: Type check Frontend
        run: npm run type-check -w web

      # 9. Проверка типов TypeScript на бэкенде
      - name: Type check Backend
        run: npm run type-check -w server

      # 10. Запуск Unit-тестов и интеграционных тестов на фронтенде
      - name: Run Unit Tests Frontend
        run: npm run test -w web

      # 11. Сборка фронтенда
      - name: Build Web App
        run: npm run build -w web
