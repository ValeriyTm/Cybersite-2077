name: Cybersite-2077 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

        # 4. Проверка линтером серверного кода
      - name: Run Lint Backend
        run: npm run lint -w server
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 5. Проверка типов TypeScript на фронтенде
      - name: Type check Frontend
        run: npm run type-check -w web

      # 6. Проверка типов TypeScript на бэкенде
      - name: Type check Backend
        run: npm run type-check -w server

      # 7. Запуск Unit-тестов и интеграционных тестов на фронтенде
      - name: Run Unit Tests Frontend
        run: npm run test -w web

      # 8. Сборка фронтенда
      - name: Build Web App
        run: npm run build -w web
