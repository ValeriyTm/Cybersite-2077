name: Cybersite-2077 CI

on:
  push:
    branches: [deploy-vps]
  pull_request:
    branches: [deploy-vps]

jobs:
  # ==========================================
  # ЭТАП 1: Тестирование и линтинг
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # 4.1. Сканирование зависимостей на уязвимости (SCA)
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Cybersite-2077"
          path: "."
          format: "HTML"
          out: "reports" # Отчет сохранится в папку reports в корне проекта
          args: >
            --failOnCVSS 8
            --nodePackageSkipDevDependencies
            --exclude "**/node_modules/**"

      # 4.2. Сохранение отчета об уязвимостях в артефакты GitHub
      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always() # Отчет запишется, даже если проверка завалится уязвимостью
        with:
          name: owasp-vulnerability-report
          path: reports/dependency-check-report.html

      # 5. Устанавливаем клиент Prisma для генерации типов
      - name: Generate Prisma Client
        run: npx prisma generate --schema=./packages/database/prisma/schema.prisma

      # 6. Проверка линтером серверного кода
      - name: Run EsLint Backend
        run: npm run lint -w server
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 7. Проверка линтером клиентского кода
      - name: Run EsLint Frontend
        run: npm run lint:js -w web
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 8. Проверка линтером клиентских стилей
      - name: Run StyleLint Frontend
        run: npm run lint:style -w web
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # 9. Проверка типов TypeScript на фронтенде
      - name: Type check Frontend
        run: npm run type-check -w web

      # 10. Проверка типов TypeScript на бэкенде
      - name: Type check Backend
        run: npm run type-check -w server

      # 11. Запуск Unit-тестов и интеграционных тестов на фронтенде
      - name: Run Unit Tests Frontend
        run: npm run test -w web

      # 12. Запуск Unit-тестов на бэкенде
      - name: Run Unit Tests Backend
        run: npm run test -w server

      # 13. Сборка фронтенда
      - name: Build Web App
        run: npm run build -w web

  # ==========================================
  # ЭТАП 2: Сборка Docker-образов и отправка в GHCR
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test # Выполнять только если тесты и линтеры прошли успешно
    permissions:
      contents: read
      packages: write # Разрешение на запись в GHCR
    env:
      REGISTRY_OWNER: "valeriytm"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Настраиваем сборщик Docker Buildx для кэширования слоев:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизуемся в GitHub Container Registry под встроенным токеном:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и отправка бэкенда:
      - name: Build and push Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/cybersite-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Сборка и отправка Nginx с фронтендом внутри:
      - name: Build and push Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/nginx/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/cybersite-nginx:latest
          # Тут передаём .env фронтенда внутрь контейнера:
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
            VITE_GOOGLE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_GOOGLE_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # ЭТАП 3: Деплой на VPS
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Выполнять только после публикации образов

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Подключаемся по SSH, создаем папку проекта, записываем docker-compose и .env:
      - name: Copy config files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Копируем файл docker-compose.prod.yml из папки deploy на сервер:
          source: "deploy/docker-compose.prod.yml"
          target: "~/cybersite"
          strip_components: 1 # Убирает вложенность папки deploy, кладет сразу в директорию ~/cybersite на VPS

      # 2. Создаем файл .env.prod из секретов GitHub и деплоим новые образы:
      - name: Deploy images on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/cybersite

            # Переписываем значения переменных окружения из репозитория GitHub (ENV_PROD_FILE) в .env.prod:
            echo "${{ secrets.ENV_PROD_FILE }}" > .env.prod

            # Авторизуем Docker на сервере в GHCR:
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Скачиваем обновленные образы:
            docker compose -f docker-compose.prod.yml pull

            # Перезапускаем контейнеры в фоне:
            docker compose -f docker-compose.prod.yml up -d

            # Удаляем старые зависшие образы, чтобы не забивать диск моего слабого VPS:
            docker image prune -f
